<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Async Users</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        #loadBtn { padding: 10px 20px; cursor: pointer; font-size: 16px; background: #007BFF; color: white; border: none; border-radius: 5px; }
        #loadBtn:disabled { background: #ccc; cursor: not-allowed; }
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #333; }
        .card p { color: #666; margin: 5px 0; }
        .error { color: red; margin-top: 10px; }
        .loading { color: #007BFF; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Список пользователей</h1>
    <button id="loadBtn">Загрузить пользователей</button>
    <div id="statusMessage"></div>
    <div id="usersContainer" class="user-grid"></div>

    <script src="script2.js"></script>
</body>
</html>
